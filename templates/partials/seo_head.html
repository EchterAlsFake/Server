{% if page_meta %}
<meta name="rating" content="adult">
<meta name="description" content="{{ page_meta.description }}">
<link rel="canonical" href="{{ page_meta.canonical }}">
<meta property="og:type" content="{{ page_meta.og_type }}">
<meta property="og:site_name" content="Porn Fetch">
<meta property="og:title" content="{{ page_meta.title }}">
<meta property="og:description" content="{{ page_meta.description }}">
<meta property="og:url" content="{{ page_meta.canonical }}">
<meta property="og:image" content="{{ config.APP_DOMAIN }}/static/media/promo-poster.jpg">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta property="og:image:alt" content="Porn Fetch video downloader interface">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_meta.title }}">
<meta name="twitter:description" content="{{ page_meta.description }}">
<meta name="twitter:image" content="{{ config.APP_DOMAIN }}/static/media/promo-poster.jpg">
<meta name="twitter:image:alt" content="Porn Fetch video downloader interface">
<script type="application/ld+json">{{ page_meta.structured|tojson }}</script>
{% endif %}
