<details class="ux-disclosure" id="website-feedback">
    <summary>{{ _("What could we improve?") }}</summary>
    <form action="{{ url_for('aggregate_analytics.feedback') }}" method="post" autocomplete="off">
        <p>{{ _("Your answer contributes to an aggregate count.") }}</p>
        <input type="hidden" name="language" value="{{ website_language }}">
        {% for key, labels in website_feedback_choices.items() %}
        <button class="btn" type="submit" name="answer" value="{{ key }}">{{ site_text(labels[0]) }}</button>
        {% endfor %}
    </form>
</details>
