<section id="premium-feedback" hidden aria-labelledby="premium-feedback-title">
    <h2 id="premium-feedback-title">What would help you decide?</h2>
    <p>Optional anonymous feedback. Only answer totals are stored; no visitor identifier is created.</p>
    <div role="group" aria-labelledby="premium-feedback-title">
        <button type="button" class="btn" data-feedback="price">Lower price</button>
        <button type="button" class="btn" data-feedback="information">More information</button>
        <button type="button" class="btn" data-feedback="payment">Easier payment</button>
        <button type="button" class="btn" data-feedback="try_first">I need to try the app first</button>
        <button type="button" class="btn" data-feedback="free_sufficient">Free meets my needs</button>
    </div>
    <p role="status" id="premium-feedback-status"></p>
</section>
