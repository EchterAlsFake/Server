<nav class="download-channels" aria-label="{{ _("Release channel") }}">
    <a href="{{ request.path }}"{% if not channel %} aria-current="page"{% endif %}>{{ _("Recommended") }}</a><a href="{{ request.path }}?channel=stable"{% if channel == 'stable' %} aria-current="page"{% endif %}>{{ _("Stable") }}</a><a href="{{ request.path }}?channel=beta"{% if channel == 'beta' %} aria-current="page"{% endif %}>{{ _("Beta") }}</a>
    <span>{{ _("Stable where available; otherwise beta. Each package shows its own version.") }}</span>
</nav>
