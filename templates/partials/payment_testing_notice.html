<div class="age-overlay payment-testing-overlay" id="payment-testing-overlay">
    <section class="age-dialog" role="dialog" aria-modal="true" aria-labelledby="payment-testing-title" aria-describedby="payment-testing-description" tabindex="-1">
        <p class="eyebrow">Before you continue</p>
        <h2 id="payment-testing-title">Real-payment testing</h2>
        <p id="payment-testing-description">Hello, this website is currently being tested for real payments. If you buy a license now it will be revoked later and all money will be refunded. Please do not buy anything!</p>
        <form action="/payment-testing/acknowledge" method="post" id="payment-testing-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ notice_next if notice_next is defined else request.full_path.rstrip('?') }}">
            <label class="age-gate-agreement" for="payment-testing-acknowledged">
                <input type="checkbox" id="payment-testing-acknowledged" name="payment_testing_acknowledged" value="yes" required>
                <span>I explicitly agree not to buy any product, as I will be refunded and loose my license</span>
            </label>
            {% if payment_testing_error %}<p class="form-error" role="alert">{{ payment_testing_error }}</p>{% endif %}
            <button class="btn btn-primary" type="submit">Continue to website <span aria-hidden="true">→</span></button>
        </form>
    </section>
</div>
