{% extends "base.html" %}
{% block body_attributes %} class="guide-surface{% if provider is defined %} guide-detail{% endif %}"{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{{ url_for('static', filename='guides.css') }}">{% endblock %}
{% block legal_navigation %}
<nav class="legal-utility guide-legal" aria-label="{{ _("Legal information") }}">
    <a {{ site_link("/impress") }}>{{ _("Impressum") }}</a><a {{ site_link("/privacy_policy") }}>{{ _("Privacy") }}</a><a {{ site_link("/terms") }}>{{ _("Terms") }}</a><a class="withdrawal-link" {% if is_onion %}href="{{ config.APP_DOMAIN }}/withdrawal"{% else %}{{ site_link("/withdrawal") }}{% endif %}>{{ _("Withdrawal") }}</a>
</nav>
{% endblock %}
