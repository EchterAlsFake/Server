{% extends "base.html" %}
{% block title %}{{ _("Tester access — Porn Fetch") }}{% endblock %}
{% block content %}
<main class="purchase-page"><h1>{{ _("Tester access") }}</h1>
<p>{{ _("Mollie sandbox testing only. No money is charged.") }}</p>
<form action="{{ site_path(url_for('mollie.unlock')) }}" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="tester-password">{{ _("Tester password") }}</label><input type="password" id="tester-password" name="password" required maxlength="1024" autocomplete="current-password">
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<button class="btn btn-primary" type="submit">{{ _("Unlock Mollie test checkout") }}</button>
</form><a href="{{ site_path("/porn_fetch") }}">{{ _("Return to payment methods") }}</a></main>
{% endblock %}
