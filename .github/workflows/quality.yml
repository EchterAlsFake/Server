name: Quality and dependency security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv sync --locked --python 3.14
      - run: uv run --locked ruff check main.py pf_server license_client mcp_service --exclude .venv
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked python scripts/test_security_browser.py
      - run: uv run --locked python scripts/test_lifetime_browser.py
      - run: uv run --locked python -O -m unittest discover -s tests -p test_security_hardening.py
      - run: uv export --locked --no-dev --no-emit-project -o /tmp/server-requirements.txt
      - run: uv run --locked pip-audit --no-deps --disable-pip -r /tmp/server-requirements.txt
      - run: uv sync --project mcp_service --locked --python 3.14
      - run: uv run --project mcp_service --locked python -m unittest discover -s mcp_service/tests
      - run: uv export --project mcp_service --locked --no-emit-project -o /tmp/mcp-requirements.txt
      - run: uv run --locked pip-audit --no-deps --disable-pip -r /tmp/mcp-requirements.txt
  promo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porn-fetch-promo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: porn-fetch-promo/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
